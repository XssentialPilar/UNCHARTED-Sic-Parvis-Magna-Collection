name: Uncharted CI Build & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-verify:
    name: Architecture & Runtime Validation
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Validate Launcher & Tool Python Syntax
        shell: pwsh
        run: |
          python -m py_compile launcher/uncharted_launcher.pyw
          python -m py_compile tools/probe_uncharted.py
          python -m py_compile tools/bake_prompt_assets.py
          Write-Host "[CI] All Python launcher and tool scripts passed bytecode compilation." -ForegroundColor Green

      - name: Verify Architecture Headers & Invariants
        shell: pwsh
        run: |
          $requiredHeaders = @(
            "include/unc/core.hpp",
            "include/unc/graphics.hpp",
            "include/unc/input.hpp",
            "include/unc/core/arena_allocator.hpp",
            "include/unc/core/frame_pacer.hpp",
            "include/unc/core/spsc_queue.hpp",
            "include/unc/graphics/dx11_backend.hpp",
            "include/unc/graphics/dynamic_ring_buffer.hpp",
            "include/unc/graphics/transient_rt_pool.hpp",
            "include/unc/graphics/vram_budget_mgr.hpp",
            "include/unc/input/input_mapper.hpp",
            "spm_core/include/spm/spm_core.h",
            "gow3_pc/gpu/shadps4/video_core/renderer_vulkan/vk_streamline.h",
            "gow3_pc/gpu/shim/gow3_dxgi_presenter.h"
          )
          foreach ($h in $requiredHeaders) {
            if (-not (Test-Path $h)) { throw "Missing architectural header: $h" }
          }
          Write-Host "[CI] All C++20/C++23 architectural headers verified." -ForegroundColor Green
