name: Uncharted CI Build & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-verify:
    name: Architecture & Runtime Validation
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Validate Launcher & Tool Python Syntax
        shell: pwsh
        run: |
          python -m py_compile Project/launcher/uncharted_launcher.pyw
          python -m py_compile Project/tools/probe_uncharted.py
          python -m py_compile tools/probe_uncharted.py
          Write-Host "[CI] All Python launcher and tool scripts passed bytecode compilation." -ForegroundColor Green

      - name: Verify Architecture Headers & Invariants
        shell: pwsh
        run: |
          $requiredHeaders = @(
            "Project/include/unc/core.hpp",
            "Project/include/unc/graphics.hpp",
            "Project/include/unc/input.hpp",
            "Project/include/unc/core/arena_allocator.hpp",
            "Project/include/unc/core/frame_pacer.hpp",
            "Project/include/unc/core/spsc_queue.hpp",
            "Project/include/unc/graphics/dx11_backend.hpp",
            "Project/include/unc/graphics/dynamic_ring_buffer.hpp",
            "Project/include/unc/graphics/transient_rt_pool.hpp",
            "Project/include/unc/graphics/vram_budget_mgr.hpp",
            "Project/include/unc/input/input_mapper.hpp"
          )
          foreach ($h in $requiredHeaders) {
            if (-not (Test-Path $h)) { throw "Missing architectural header: $h" }
          }
          Write-Host "[CI] All C++20/C++23 architectural headers verified." -ForegroundColor Green

      - name: Validate Packaging & SHA-256 Manifest
        shell: pwsh
        run: |
          $shaFile = "Distribution/Uncharted/SHA256SUMS.txt"
          if (Test-Path $shaFile) {
            $manifest = Get-Content $shaFile
            Write-Host "[CI] Found SHA256SUMS manifest with $($manifest.Count) entries." -ForegroundColor Green
          } else {
            powershell -ExecutionPolicy Bypass -File "Project/tools/Package.ps1"
          }

      - name: Validate Launcher Executable & Runtime Integrity
        shell: pwsh
        run: |
          $exes = @(
            "Uncharted - Sic Parvis Magna Collection.exe",
            "Project/Uncharted - Sic Parvis Magna Collection.exe",
            "Project/gow3_pc/out/Uncharted.exe",
            "Distribution/Uncharted/Uncharted.exe"
          )
          foreach ($exe in $exes) {
            if (Test-Path $exe) {
              $size = (Get-Item $exe).Length
              Write-Host "[CI] Verified binary: $exe ($size bytes)" -ForegroundColor Green
            }
          }
